<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0d6efd">
  <meta name="description" content="EarnX Rewards App">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">

  <title>EarnX - Login</title>
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand">
        <div class="brand-logo">EX</div>
        <h1>Welcome to EarnX</h1>
        <p>
          Earn rewards for valid activities.
          Rewards and withdrawals are subject to limits and review.
        </p>
      </div>

      <button id="googleBtn" type="button">
        Continue with Google
      </button>

      <p id="error" role="alert"></p>

      <p class="terms">
        By continuing, you agree to use the app legitimately
        and not manipulate advertising or referrals.
      </p>

    </section>

  </main>

  <script type="module" src="./auth.js"></script>

</body>
</html>
