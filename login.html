<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0d6efd">
  <meta name="description" content="EarnX Rewards App">

  <title>EarnX - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef5ff, #ffffff);
      color: #122033;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 25px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(13, 110, 253, 0.15);
      border: 1px solid #e5eaf2;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d6efd, #084298);
      color: white;
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(13, 110, 253, 0.25);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      color: #122033;
    }

    .description {
      margin: 0 auto 25px;
      color: #6c7a90;
      line-height: 1.6;
      font-size: 15px;
    }

    #googleBtn {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #d8dee9;
      border-radius: 14px;
      background: #ffffff;
      color: #222222;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    #googleBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
    }

    #googleBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #error {
      min-height: 22px;
      margin: 14px 0;
      color: #dc3545;
      font-size: 13px;
    }

    .terms {
      margin: 20px 0 0;
      color: #8a96a8;
      font-size: 12px;
      line-height: 1.6;
    }

    .secure {
      margin-top: 20px;
      color: #198754;
      font-size: 12px;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand-logo">
        EX
      </div>

      <h1>Welcome to EarnX</h1>

      <p class="description">
        Earn rewards for valid activities.
        Rewards and withdrawals are subject to limits and review.
      </p>

      <button id="googleBtn" type="button">
        Continue with Google
      </button>

      <p id="error"></p>

      <p class="secure">
        🔒 Secure Firebase Authentication
      </p>

      <p class="terms">
        By continuing, you agree to use the app legitimately
        and not manipulate advertising or referrals.
      </p>

    </section>

  </main>

  <script type="module" src="./auth.js"></script>

</body>
</html>
