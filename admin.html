<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./css/style.css"><title>EarnX — Admin</title></head><body><div class="app"><header class="topbar"><b>Admin Console</b><span class="pill">Restricted</span></header><main class="page"><p id="adminError" class="error"></p><div id="stats" class="grid"></div><section class="card"><h2>Configuration</h2><form id="configForm" class="form"><label class="field"><span>Coins per ₹1</span><input id="coinsPerRupee" type="number" min="1" required></label><label class="field"><span>Rewarded ad coins</span><input id="adCoins" type="number" min="0" required></label><label class="field"><span>Minimum withdrawal coins</span><input id="minWithdrawal" type="number" min="1" required></label><label class="field"><span>Referral reward coins</span><input id="refReward" type="number" min="0" required></label><label class="field"><span>Referral qualifying coins</span><input id="refQual" type="number" min="0" required></label><button class="btn btn-primary">Save config</button></form></section><section class="card"><h2>Withdrawals</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>ID</th><th>User</th><th>Coins</th><th>Status</th><th>Action</th></tr></thead><tbody id="wrows"></tbody></table></div></section><section class="card"><h2>Users</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Coins</th><th>Status</th><th></th></tr></thead><tbody id="urows"></tbody></table></div></section><section class="card"><h2>Create task</h2><form id="taskForm" class="form"><label class="field"><span>Title</span><input id="taskTitle" required></label><label class="field"><span>Description</span><input id="taskDescription"></label><label class="field"><span>Reward coins</span><input id="taskReward" type="number" min="1" required></label><label class="field"><span>Daily limit</span><input id="taskLimit" type="number" min="1" value="1" required></label><label class="field"><span>Completion mode</span><select id="taskMode"><option value="admin_review">Admin review</option><option value="external">External verifier placeholder</option></select></label><button class="btn btn-primary">Create task</button></form></section><section class="card"><h2>Tasks</h2><div id="tasks" class="list"></div></section><section class="card"><h2>Pending task reviews</h2><div id="completions" class="list"></div></section></main></div><div id="toast" class="toast"></div><script type="module" src="./js/admin.js"></script></body></html>
