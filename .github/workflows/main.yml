name: Build EarnX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed EarnX project
        run: |
          rm -rf earnx_project
          unzip -o EarnX-AndroidIDE-ready-FIXED.zip -d earnx_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Android project
        run: |
          test -f earnx_project/EarnX_cap/android/settings.gradle.kts
          test -f earnx_project/EarnX_cap/android/app/build.gradle.kts
          echo "Android project found."

      - name: Build Debug APK
        working-directory: earnx_project/EarnX_cap/android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          find earnx_project/EarnX_cap/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-APK
          path: earnx_project/EarnX_cap/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
