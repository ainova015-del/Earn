name: Build EarnX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EarnX project
        run: |
          rm -rf earnx_project
          unzip -o EarnX-AndroidIDE-ready-FIXED.zip -d earnx_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Enable AndroidX
        run: |
          touch earnx_project/EarnX_cap/android/gradle.properties

          echo "android.useAndroidX=true" >> earnx_project/EarnX_cap/android/gradle.properties
          echo "android.enableJetifier=true" >> earnx_project/EarnX_cap/android/gradle.properties

      - name: Fix Java and Kotlin JVM target
        working-directory: earnx_project/EarnX_cap/android
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/sourceCompatibility = 1\.8/sourceCompatibility = JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/targetCompatibility = 1\.8/targetCompatibility = JavaVersion.VERSION_17/g' app/build.gradle.kts

          cat >> app/build.gradle.kts <<'EOF'

          // EarnX JVM compatibility fix
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "Java/Kotlin JVM target fixed to 17"

      - name: Check Android project
        run: |
          test -f earnx_project/EarnX_cap/android/settings.gradle.kts
          test -f earnx_project/EarnX_cap/android/app/build.gradle.kts
          echo "Android project OK"

      - name: Build Debug APK
        working-directory: earnx_project/EarnX_cap/android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          find earnx_project/EarnX_cap/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-APK
          path: |
            earnx_project/EarnX_cap/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
