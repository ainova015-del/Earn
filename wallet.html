<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./css/style.css"><title>EarnX — Wallet</title></head><body><div class="app"><header class="topbar"><b>Wallet</b><span class="pill">Secure ledger</span></header><main class="page"><section class="card balance"><div class="muted">Available coins</div><h2 id="coins">0</h2><div id="value">₹0.00</div></section><div class="grid"><div class="stat"><span class="muted">Total earned</span><b id="earned">0</b></div><div class="stat"><span class="muted">Pending coins</span><b id="pending">0</b></div></div><section class="card"><h2>Request withdrawal</h2><form id="withdrawForm" class="form"><label class="field"><span>Amount in coins</span><input id="amount" type="number" min="1000" step="100" required></label><label class="field"><span>UPI ID</span><input id="upi" placeholder="name@bank" required></label><label><input type="checkbox" required> I confirm these details are correct.</label><button class="btn btn-primary" type="submit">Submit withdrawal request</button></form><p class="fineprint">A request is created as pending. No payment is marked successful automatically.</p></section><section class="card"><h2>Withdrawal history</h2><div id="withdrawals" class="list"><div class="muted">Loading…</div></div></section></main></div><div id="toast" class="toast"></div><script type="module" src="./js/wallet.js"></script></body></html>
